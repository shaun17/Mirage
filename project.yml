name: Mirage

options:
  developmentLanguage: zh-Hans
  xcodeVersion: "26.0"
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: N4TQ2P9B46
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    CLANG_ENABLE_MODULES: YES

targets:
  MirageCore:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/MirageCore
    settings:
      base:
        PRODUCT_NAME: MirageCore
        SKIP_INSTALL: YES

  MirageFileProvider:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/MirageFileProvider
    info:
      path: Config/MirageFileProvider-Info.plist
      properties:
        CFBundleDisplayName: Mirage
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.fileprovider-nonui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FileProviderExtension
          NSExtensionFileProviderSupportsEnumeration: true
          NSExtensionFileProviderDocumentGroup: N4TQ2P9B46.group.com.wenren.Mirage
    entitlements:
      path: Config/MirageFileProvider.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - N4TQ2P9B46.group.com.wenren.Mirage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wenren.Mirage.FileProvider
        PRODUCT_NAME: MirageFileProvider
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - target: MirageCore

  Mirage:
    type: application
    platform: macOS
    sources:
      - path: Sources/MirageApp
    info:
      path: Config/Mirage-Info.plist
      properties:
        CFBundleDisplayName: Mirage
        CFBundleName: Mirage
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.productivity
        NSFileProviderDomainUsageDescription: Mirage 需要在系统文件选择器中提供可搜索的头像和图片。
        NSPrincipalClass: NSApplication
    entitlements:
      path: Config/Mirage.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - N4TQ2P9B46.group.com.wenren.Mirage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wenren.Mirage
        PRODUCT_NAME: Mirage
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: MirageCore
      - target: MirageFileProvider
        embed: true
        codeSign: true

  MirageCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/MirageCoreTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wenren.Mirage.CoreTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
    dependencies:
      - target: MirageCore

schemes:
  Mirage:
    build:
      targets:
        Mirage: all
        MirageFileProvider: all
        MirageCoreTests: [test]
    test:
      targets:
        - MirageCoreTests
    run:
      config: Debug
    archive:
      config: Release
