name: Mirage

options:
  developmentLanguage: zh-Hans
  xcodeVersion: "26.0"
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: N4TQ2P9B46
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    CLANG_ENABLE_MODULES: YES
    CURRENT_PROJECT_VERSION: "35"
    MARKETING_VERSION: "0.4.1"

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.4

targets:
  MirageCore:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/MirageCore
    settings:
      base:
        PRODUCT_NAME: MirageCore
        SKIP_INSTALL: YES

  MirageDetailWindow:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/MirageDetailWindow
    settings:
      base:
        PRODUCT_NAME: MirageDetailWindow
        SKIP_INSTALL: YES

  MirageFileProvider:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/MirageFileProvider
    info:
      path: Config/MirageFileProvider-Info.plist
      properties:
        CFBundleDisplayName: Mirage
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.fileprovider-nonui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FileProviderExtension
          NSExtensionFileProviderSupportsEnumeration: true
          NSExtensionFileProviderDocumentGroup: N4TQ2P9B46.group.com.wenren.Mirage
    entitlements:
      path: Config/MirageFileProvider.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - N4TQ2P9B46.group.com.wenren.Mirage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wenren.Mirage.FileProvider
        PRODUCT_NAME: MirageFileProvider
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - target: MirageCore

  Mirage:
    type: application
    platform: macOS
    sources:
      - path: Sources/MirageApp
    info:
      path: Config/Mirage-Info.plist
      properties:
        CFBundleDisplayName: Mirage
        CFBundleName: Mirage
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        NSFileProviderDomainUsageDescription: Mirage 需要在系统文件选择器中提供可浏览和选择的头像与图片。
        NSPrincipalClass: NSApplication
        SUAutomaticallyUpdate: false
        SUEnableAutomaticChecks: true
        SUEnableInstallerLauncherService: true
        SUFeedURL: https://github.com/shaun17/Mirage/releases/latest/download/appcast.xml
        SUPublicEDKey: ZFNKnYFxseZp3racb1Mngcd9DiAtY+KgVy3qYpZs4fo=
        SURequireSignedFeed: true
        SUVerifyUpdateBeforeExtraction: true
    entitlements:
      path: Config/Mirage.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - N4TQ2P9B46.group.com.wenren.Mirage
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wenren.Mirage
        PRODUCT_NAME: Mirage
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: MirageCore
      - target: MirageDetailWindow
      - package: Sparkle
      - target: MirageFileProvider
        embed: true
        codeSign: true

  MirageCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/MirageCoreTests
      # 这些无 UI 的生产源直接编入测试模块，锁住 App 与 File Provider 状态机而不启动宿主进程。
      - path: Sources/MirageApp/AppViewState.swift
      - path: Sources/MirageApp/PhotoSourceSettingsModel.swift
      - path: Sources/MirageApp/SearchModel.swift
      - path: Sources/MirageApp/ThumbnailLoader.swift
      - path: Sources/MirageFileProvider/ProviderAsyncSupport.swift
      - path: Sources/MirageFileProvider/ProviderCatalog.swift
      - path: Sources/MirageFileProvider/ProviderIdentifiers.swift
      - path: Sources/MirageFileProvider/ProviderDiscoveryTreePlanner.swift
      - path: Sources/MirageFileProvider/ProviderItem.swift
      - path: Sources/MirageFileProvider/ProviderPagePlanner.swift
      - path: Sources/MirageFileProvider/ProviderRepository.swift
      - path: Sources/MirageFileProvider/ProviderSearchResultStoring.swift
      - path: Sources/MirageFileProvider/ProviderSearchCache.swift
      - path: Sources/MirageFileProvider/ProviderThumbnailBatch.swift
      - path: Sources/MirageFileProvider/SearchEnumerator.swift
      - path: Sources/MirageFileProvider/SearchPagePlanner.swift
      - path: Sources/MirageFileProvider/SearchResult.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wenren.Mirage.CoreTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
    dependencies:
      - target: MirageCore
      - target: MirageDetailWindow

schemes:
  MirageCoreTests:
    build:
      targets:
        MirageCoreTests: [test]
    test:
      targets:
        - MirageCoreTests
  Mirage:
    build:
      targets:
        Mirage: all
        MirageFileProvider: all
        MirageCoreTests: [test]
    test:
      targets:
        - MirageCoreTests
    run:
      config: Debug
    archive:
      config: Release
